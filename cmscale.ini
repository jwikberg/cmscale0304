; cmscale settings. Copy this file next to cm0304.exe together with dsound.dll.
; README.md describes every option, and docs/ explains how each one works.
[cmscale]

; ---- Display ----
; In a window, the game lays out at the window's client size divided by zoom, clamped
; to its 1024x768 to 1600x1200 range, and cmscale scales that picture to fill the window.
; 1.0 keeps the stock layout, and 1.5 makes everything 50% bigger. No effect in -fullscreen.
zoom=1.0
; 1 = -fullscreen keeps the desktop resolution and scales the game, instead of switching
; the monitor to 1024x768.
borderless=1
; opengl scales on the GPU and uploads only the areas that changed. gdi is a slower CPU fallback.
renderer=opengl
; sharp gives crisp pixels with smooth edges, smooth is bilinear and nearest is blocky.
filter=sharp
; 1 = scale only by whole multiples, with bigger black bars, possibly on all four sides.
integer=0
; OpenGL only. vsync=1 waits for vblank on each redraw, and max_fps caps redraws per second.
; Changes that arrive between redraws appear on the next one.
vsync=0
max_fps=60
; 1 = stop the mouse pointer blinking. The game hides and shows it again around every
; cursor change, and Wine makes that visible. 0 = stock behaviour.
cursor_fix=1

; ---- Exact speed-ups: the same results as the stock game ----
; 1 = when the game polls an idle screen in a tight loop, wait up to 1 ms for input.
; Idle CPU drops from 100% of a core to a few percent. 0 = stock behaviour.
idle_wait=1
; 1 = replace the match engine's slow integer square roots with exact SSE2 versions.
; Match days take about 11% less CPU. 0 = stock code.
fast_sqrt=1
; 1 = scale the random number generator's draws with one multiply instead of a library
; call, which saves about 2% of a match day. 2 = also refill its state with SSE2, about
; 1% more. 0 = stock code.
fast_rand=2
; 1 = remember dynamic_cast results instead of comparing type names every time.
; Long holidays under Wine take about 11% less time. 0 = stock.
fast_dyncast=1
; 1 = prefetch the data of the AI's transfer and loan shortlist candidates ahead of its
; scans, which then check about 12% more candidates per second. 0 = stock.
prefetch=1

; ---- Parallel processing: results differ from a stock run ----
; Simulate the day's background matches on this many threads, up to 16. A three-month
; holiday takes about 21% less time. Results differ from a serial run, as they do between
; any two stock runs, because the game seeds each match from the clock.
; 0 = stock, one match at a time.
par_matches=8
; Split the AI's transfer and loan searches, each of which scores every player in the
; database, over this many threads, up to 16. Long holidays take about 28% less time, and
; transfer windows about 35% less. The random numbers inside a search differ from a
; serial run's. 0 = stock, one thread.
par_scan=8

; ---- Convenience ----
; 1 = skip the startup logos. The main menu appears after about 1.5 s instead of about
; 20 s, as if a key had been pressed. 0 = stock.
skip_splash=1
; 1 = the mouse's back/forward side buttons and the keyboard's browser keys go back and
; forward through the screens, like the arrows under the date. 0 = stock.
mouse_nav=1
; The speed of highlights in a match you watch. 0 = stock (Real Time, whatever the match
; speed), 1 = Fast (3x), 2 = Very Fast (8x). The match's own Speed setting still sets the
; pace between highlights. Replays and the highlights viewer keep their own speed and
; slow motion.
match_hl_speed=0
; How fast Very Fast in the match Speed menu is, in multiples of Medium (stock 8, up to
; 1000). After changing it, pick Very Fast again in a match.
match_speed_max=8
